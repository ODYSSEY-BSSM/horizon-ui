name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check-hotfix:
    runs-on: ubuntu-latest
    outputs:
      is_hotfix: ${{ steps.check.outputs.is_hotfix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if hotfix
        id: check
        run: |
          if git log -1 --pretty=%B | grep -q "^hotfix:"; then
            echo "is_hotfix=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_hotfix=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check-hotfix
    if: needs.check-hotfix.outputs.is_hotfix != 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: matrix.node-version == '20.x'
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [check-hotfix, test]
    if: always()
    steps:
      - name: Report overall status
        run: |
          if [[ "${{ needs.check-hotfix.outputs.is_hotfix }}" == "true" ]]; then
            echo "Hotfix detected - skipping CI checks"
            exit 0
          elif [[ "${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped" ]]; then
            echo "All CI checks passed successfully or were skipped."
            exit 0
          else
            echo "Some CI checks failed."
            exit 1
          fi
